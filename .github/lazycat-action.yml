version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/monetr.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: monetr

build:
  run_buildscript: false

images:
  - id: monetr
    target: service
    service: monetr
    source: ghcr.io/monetr/monetr
    channel: stable
    sort: semver
    tag_regex: '^\d+\.\d+\.\d+$'
    delivery:
      mode: mirror
      require_digest_match: true

stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: monetr
    summary: "预算管理：周期性支出规划"
